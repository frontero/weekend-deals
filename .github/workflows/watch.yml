# The price watch without the Mac: every ten minutes GitHub checks whether half an hour passed since the last watch
# run, and if so samples the same few searches to see when providers change their prices (server/watch.mjs).
# Runs apart from the price rounds, so a round of an hour leaves no gap. Needs the secrets TURSO_DATABASE_URL and
# TURSO_AUTH_TOKEN (Settings → Secrets and variables → Actions).
name: Price watch

on:
  # Cloudflare starts this every ten minutes (worker/clock.mjs); GitHub's own schedule, which it delays by hours, is
  # only the fallback.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      READY: ${{ secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "::warning::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN under Settings → Secrets and variables → Actions."
      - if: env.READY == 'true'
        # Pinned to a commit: a moved tag cannot change what runs next to the secrets.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: env.READY == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: env.READY == 'true'
        # No install scripts: the jobs need none, and they would run next to the secrets.
        run: npm ci --omit=dev --ignore-scripts
      - if: env.READY == 'true'
        run: node server/watch-cli.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: weekenddeals
          TZ: Europe/Amsterdam
