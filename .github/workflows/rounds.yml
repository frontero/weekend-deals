# Price rounds without the Mac: every ten minutes GitHub makes the same check as the background job on the Mac
# (npm run background:on), and runs a round when one is due or the app asked for one.
# Needs these repository secrets (Settings → Secrets and variables → Actions), with the values from .env.local:
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, GOOGLE_PLACES_API_KEY and WORKER_URL. With TURSO_API_TOKEN (a Turso platform
# token) rounds hold back before the free plan's monthly limit is reached (server/budget.mjs).
name: Price rounds

on:
  # Cloudflare starts this every ten minutes (worker/clock.mjs); GitHub's own schedule, which it delays by hours, is
  # only the fallback.
  schedule:
    - cron: '23 * * * *'
  # A check right away, from the Actions tab.
  workflow_dispatch:

# One at a time: a check that comes in during a round waits for it.
concurrency:
  group: price-rounds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # A full round of every party size takes about an hour.
    timeout-minutes: 120
    env:
      # Without the database there is nowhere to keep prices, so nothing runs until the secrets are set.
      READY: ${{ secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "::warning::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN under Settings → Secrets and variables → Actions."
      - if: env.READY == 'true'
        # Pinned to a commit: a moved tag cannot change what runs next to the secrets.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: env.READY == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: env.READY == 'true'
        # No install scripts: the jobs need none, and they would run next to the secrets.
        run: npm ci --omit=dev --ignore-scripts
      - if: env.READY == 'true'
        run: node server/collect-cli.mjs --if-due
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          TRADETRACKER_CUSTOMER_ID: ${{ secrets.TRADETRACKER_CUSTOMER_ID }}
          TRADETRACKER_PASSPHRASE: ${{ secrets.TRADETRACKER_PASSPHRASE }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: weekenddeals
          # The round times (06:45 and 18:00) are Dutch time.
          TZ: Europe/Amsterdam
